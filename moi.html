<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">

<title>Moi | P HOME</title>

<style>
:root{
  --bg:#0d1117;
  --surface:#151b23;
  --surface-2:#10151c;
  --border:#2a323d;
  --border-strong:#3d4856;
  --text:#f0f3f6;
  --muted:#8b95a3;
  --accent:#3b8cff;
  --accent-soft:rgba(59,140,255,.14);
  --green:#3ddc84;
  --green-soft:rgba(61,220,132,.12);
  --danger:#ff6262;
  --radius:14px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
}

button,
a{
  font:inherit;
}

button{
  border:0;
}

a{
  color:inherit;
  text-decoration:none;
}

.page{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:18px 15px 105px;
}

/* =========================
   HEADER
========================= */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:20px;
}

.user-head{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.avatar{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:50%;
  background:#111820;
  border:1px solid var(--border-strong);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:7px;
}

.user-info{
  min-width:0;
}

.phone{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.level{
  margin-top:4px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--muted);
}

.level-badge{
  color:var(--green);
  background:var(--green-soft);
  border:1px solid rgba(61,220,132,.18);
  border-radius:999px;
  padding:3px 7px;
  font-weight:700;
}

.brand-area{
  display:flex;
  align-items:center;
  gap:9px;
}

.brand-logo{
  width:48px;
  height:34px;
  object-fit:contain;
}

.logout{
  width:36px;
  height:36px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.18s;
}

.logout:active{
  transform:scale(.95);
  background:#1b222c;
}

.logout svg{
  width:18px;
  height:18px;
}

/* =========================
   BALANCE
========================= */

.balance-card{
  background:linear-gradient(
    145deg,
    #171e27,
    #121820
  );
  border:1px solid var(--border);
  border-radius:17px;
  padding:20px 18px;
  margin-bottom:12px;
}

.balance-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.balance-item:first-child{
  border-right:1px solid var(--border);
  padding-right:16px;
}

.balance-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:8px;
}

.balance-value{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.3px;
}

.balance-unit{
  font-size:12px;
  color:var(--muted);
  margin-left:3px;
  font-weight:500;
}

/* =========================
   MINI ACTIONS
========================= */

.money-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  margin-bottom:20px;
}

.money-action{
  min-height:57px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
  font-size:13px;
  font-weight:650;
  border-right:1px solid var(--border);
  transition:.18s;
}

.money-action:last-child{
  border-right:0;
}

.money-action:active{
  background:#1b222c;
}

.money-action span{
  display:flex;
  align-items:center;
  gap:7px;
}

.money-action svg{
  width:17px;
  height:17px;
  color:var(--accent);
}

/* =========================
   MENU
========================= */

.section-title{
  font-size:13px;
  color:var(--muted);
  margin:0 0 9px 3px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-bottom:20px;
}

.menu-card{
  min-height:91px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:9px 5px;
  transition:.18s;
}

.menu-card:active{
  transform:scale(.97);
  background:#1b222c;
}

.menu-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--surface-2);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:8px;
  color:var(--accent);
}

.menu-icon svg{
  width:18px;
  height:18px;
}

.menu-text{
  font-size:11px;
  line-height:1.25;
  color:#dce1e7;
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;
  inset:0;
  background:rgba(13,17,23,.82);
  backdrop-filter:blur(3px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.loader-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 24px;
  color:var(--muted);
  font-size:13px;
}

.hidden{
  display:none;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:50;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:560px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(13,17,23,.96);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
}

.nav-inner{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.nav-item{
  height:53px;
  border-radius:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:var(--muted);
  font-size:10px;
}

.nav-item svg{
  width:19px;
  height:19px;
}

.nav-item.active{
  color:var(--accent);
  background:var(--accent-soft);
}

@media(max-width:380px){
  .menu-grid{
    gap:6px;
  }

  .menu-card{
    min-height:86px;
  }

  .menu-text{
    font-size:10px;
  }

  .balance-value{
    font-size:19px;
  }
}
</style>
</head>

<script>
const API_BASE =
  "https://rdnrmufucbhsvgpnqodh.supabase.co/functions/v1";

const PROFILE_ENDPOINT =
  API_BASE + "/p-home-profile";

const token =
  sessionStorage.getItem("phome_session_token");


/* =========================
   SESSION
========================= */

if (!token) {
  window.location.replace("login.html");
}


/* =========================
   OUTILS
========================= */

function formatMoney(value){
  return Number(value || 0).toLocaleString("fr-FR", {
    maximumFractionDigits: 2
  });
}


/* =========================
   CHARGEMENT PROFIL
========================= */

async function loadProfile(){

  try{

    const response = await fetch(PROFILE_ENDPOINT, {
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        token:token
      })
    });


    const data = await response.json().catch(() => ({}));


    if(response.status === 401){

      sessionStorage.removeItem("phome_session_token");
      sessionStorage.removeItem("phome_user_id");

      window.location.replace("login.html");
      return;
    }


    if(!response.ok || !data.success){

      throw new Error(
        data.message ||
        "Impossible de charger le profil."
      );
    }


    /* NUMÉRO */

    document.getElementById("userPhone").textContent =
      data.user?.phone || "—";


    /* NIVEAU */

    const level =
      Number(data.user?.level || 0);

    document.getElementById("userLevel").textContent =
      level > 0
        ? "LV" + level
        : "Aucun";


    /* SOLDE */

    document.getElementById("balance").textContent =
      formatMoney(data.balance);


    /* REVENUS CUMULÉS */

    document.getElementById("totalCumule").textContent =
      formatMoney(data.total_cumule);


  }catch(error){

    console.error(error);

    document.getElementById("userPhone").textContent = "Erreur";
    document.getElementById("userLevel").textContent = "—";

  }finally{

    document.getElementById("loading")
      .classList.add("hidden");
  }
}


/* =========================
   DÉCONNEXION
========================= */

document
  .getElementById("logoutBtn")
  .addEventListener("click", () => {

    sessionStorage.removeItem("phome_session_token");
    sessionStorage.removeItem("phome_user_id");

    window.location.replace("login.html");
  });


/* =========================
   START
========================= */

if(token){
  loadProfile();
}
</script>
