<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#071a13">
<title>Centrale de produit | P HOME</title>

<style>
:root{
  --bg:#f4f7f5;
  --green:#0b5b40;
  --deep:#071a13;
  --gold:#e9bd62;
  --muted:#77847e;
  --white:#fff;
  --danger:#9e382a;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:#17231d;
  padding-bottom:88px;
}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}

/* En-tête */
.top{
  background:linear-gradient(135deg,#071a13,#0d5139);
  color:#fff;
  padding:22px 18px 40px;
  border-radius:0 0 25px 25px;
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  width:43px;height:43px;border-radius:14px;
  background:linear-gradient(145deg,#f6d58d,#d6a843);
  color:#10291d;display:grid;place-items:center;
  font-size:22px;font-weight:900;
  box-shadow:0 5px 15px #0002;
  overflow:hidden;
}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand-name{font-size:20px;font-weight:850;letter-spacing:1.5px}
.brand-sub{font-size:10px;color:#d0e0d7;margin-top:3px;letter-spacing:1.8px}
.welcome{margin-top:25px}
.welcome small{color:#c8ddd1;font-size:13px}
.welcome h1{font-size:24px;margin:6px 0 0;font-weight:750}

main{max-width:760px;margin:auto}

/* Résumé */
.summary{
  margin:-22px 14px 0;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  position:relative;
}
.summary-card{
  min-width:0;width:100%;text-align:left;color:inherit;
  background:#fff;border:1px solid #e9efeb;border-radius:18px;
  padding:16px 14px;
  box-shadow:0 4px 18px #183d2b08;
  transition:transform .15s;
}
.summary-card:active{transform:scale(.98)}
.summary-top{display:flex;align-items:center;gap:10px}
.summary-icon{
  width:43px;height:43px;border-radius:14px;flex-shrink:0;
  display:grid;place-items:center;font-size:21px;
}
.summary-icon.green{background:#e4f4eb;color:#0a754b}
.summary-icon.gold{background:#fff2d9;color:#a87313}
.summary-value{font-size:19px;font-weight:850;overflow-wrap:anywhere;color:var(--green)}
.summary-label{margin-top:12px;font-size:14px;font-weight:750}
.summary-link{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:5px;color:#89958e;font-size:11px;
}

/* Titres */
.section-title{
  margin:24px 17px 12px;
  font-size:16px;font-weight:800;
}

/* Onglets */
.tabs{
  display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;
  margin:0 14px 14px;
}
.tab,.layout-btn{
  border:1px solid #e9efeb;background:#fff;color:var(--muted);
  border-radius:13px;min-height:42px;padding:9px 10px;
  font-size:13px;font-weight:700;
}
.tab.active{
  background:linear-gradient(140deg,#0b5b40,#073624);
  color:#fff;border-color:transparent;
}
.layout-btn{min-width:43px;font-size:19px;color:#a87313;background:#fff2d9;border-color:#fff2d9}

/* Statut */
.status{
  margin:14px 14px 0;padding:12px 14px;border-radius:12px;
  background:#fff;border:1px solid #e9efeb;
  font-size:12px;line-height:1.5;color:var(--muted);
}
.status.error{background:#fff0ed;border-color:#fff0ed;color:var(--danger)}
.status.success{background:#e4f4eb;border-color:#e4f4eb;color:#0a754b}

/* Produits */
.product-list{
  padding:0 14px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.product-list.list-mode{grid-template-columns:1fr}
.product-card{
  overflow:hidden;min-width:0;
  background:#fff;border:1px solid #e9efeb;border-radius:18px;
  box-shadow:0 4px 18px #183d2b08;
}
.product-picture{
  height:130px;position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(140deg,#0d5139,#071a13 80%);
}
.product-picture img{width:100%;height:100%;object-fit:cover}
.product-picture::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 55%);
  pointer-events:none;
}
.product-picture h3{
  position:absolute;top:12px;left:12px;right:10px;z-index:1;
  margin:0;font-size:14px;line-height:1.3;font-weight:750;color:#fff;
  text-shadow:0 1px 4px #0008;
}
.product-symbol{font-size:36px;color:var(--gold);opacity:.8}
.product-info{padding:13px 12px 14px}
.price{
  font-weight:850;font-size:17px;margin-bottom:10px;
  color:var(--green);overflow-wrap:anywhere;
}
.detail-row{
  display:flex;justify-content:space-between;gap:8px;
  margin:9px 0;font-size:11px;line-height:1.4;
}
.detail-row .label{color:#89958e}
.detail-row .value{text-align:right;font-weight:700;overflow-wrap:anywhere}
.buy-btn{
  width:100%;border:0;border-radius:13px;
  background:linear-gradient(145deg,#f6d58d,#d6a843);
  color:#10291d;font-size:13px;font-weight:800;
  padding:13px 8px;margin-top:12px;
  box-shadow:0 5px 15px #d6a84333;
}
.buy-btn:active{transform:scale(.98)}
.buy-btn:disabled{opacity:.55;cursor:wait}
.owned-badge{
  text-align:center;background:#e4f4eb;color:#0a754b;
  border-radius:12px;padding:11px 6px;margin-top:12px;
  font-size:12px;font-weight:800;
}
.empty{
  grid-column:1/-1;text-align:center;color:var(--muted);
  background:#fff;border:1px dashed #d5dfd9;border-radius:17px;
  padding:25px 14px;font-size:13px;line-height:1.6;
}

/* Navigation du bas */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  height:76px;background:#fff;
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:8px 8px max(8px,env(safe-area-inset-bottom));
  box-shadow:0 -5px 25px #163b2b0b;
  border-top:1px solid #e9efeb;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;color:#8b9890;font-size:10px;
  font-weight:600;
}
.nav-icon{font-size:20px;line-height:1}
.nav-item.active{color:var(--green)}
.nav-item.active .nav-icon{transform:translateY(-1px)}

@media(min-width:600px){
  body{max-width:480px;margin:auto;border-left:1px solid #e6ece8;border-right:1px solid #e6ece8}
  .bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:480px}
}
@media(max-width:360px){
  .summary-value{font-size:16px}
  .product-list{gap:8px;padding:0 10px}
  .product-info{padding:10px 9px 12px}
  .product-picture{height:115px}
}
</style>
</head>

<body>
<header class="top">
  <div class="brand">
    <div class="logo"><img src="logoreg.png" alt="P HOME" onerror="this.remove();this.parentNode.textContent='P'"></div>
    <div>
      <div class="brand-name">P HOME</div>
      <div class="brand-sub">VOTRE ESPACE PERSONNEL</div>
    </div>
  </div>

  <div class="welcome">
    <small>Découvrez et gérez vos produits</small>
    <h1>Centrale de produit</h1>
  </div>
</header>

<main>
  <section class="summary">
    <button class="summary-card" id="myProductsLink" type="button">
      <div class="summary-top">
        <div class="summary-icon green">▣</div>
        <div class="summary-value" id="productCount">—</div>
      </div>
      <div class="summary-label">Mon produit</div>
      <div class="summary-link">
        <span>Voir mes produits</span><span>›</span>
      </div>
    </button>

    <button class="summary-card" id="incomeLink" type="button">
      <div class="summary-top">
        <div class="summary-icon gold">◈</div>
        <div class="summary-value" id="totalIncome">—</div>
      </div>
      <div class="summary-label">Total cumulé (FCFA)</div>
      <div class="summary-link">
        <span>Voir mes revenus</span><span>›</span>
      </div>
    </button>
  </section>

  <div id="pageStatus" class="status" role="status">
    Chargement des données depuis la base…
  </div>

  <section id="myProductsSection">
    <h2 class="section-title">Mes produits achetés</h2>
    <div id="myProductsList" class="product-list">
      <div class="empty">Chargement…</div>
    </div>
  </section>

  <section id="catalogSection">
    <h2 class="section-title">Découvrir les produits</h2>

    <div class="tabs">
      <button class="tab active" data-tab="products" type="button">
        Produit
      </button>
      <button class="tab" data-tab="promotions" type="button">
        Promotion
      </button>
      <button class="layout-btn" id="layoutToggle" type="button"
              aria-label="Changer la disposition" title="Changer la disposition">
        ▦
      </button>
    </div>

    <div id="catalogList" class="product-list">
      <div class="empty">Chargement des produits…</div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <a class="nav-item" href="dashboard.html">
    <span class="nav-icon">⌂</span><span>Accueil</span>
  </a>
  <a class="nav-item active" href="produit.html">
    <span class="nav-icon">▣</span><span>Produit</span>
  </a>
  <a class="nav-item" href="equipe.html">
    <span class="nav-icon">♧</span><span>Équipe</span>
  </a>
  <a class="nav-item" href="moi.html">
    <span class="nav-icon">◎</span><span>Moi</span>
  </a>
</nav>

<script>
"use strict";

const API_BASE =
  "https://rdnrmufucbhsvgpnqodh.supabase.co/functions/v1";

const PRODUCTS_ENDPOINT = API_BASE + "/p-home-products";
const BUY_ENDPOINT = API_BASE + "/p-home-buy-product";

const token = sessionStorage.getItem("phome_session_token");
const userId = sessionStorage.getItem("phome_user_id");

const $ = id => document.getElementById(id);

let catalogProducts = [];
let promotionProducts = [];
let myProducts = [];
let activeTab = "products";
let gridMode = true;

function money(value) {
  const n = Number(value || 0);
  return Number.isFinite(n)
    ? Math.round(n).toLocaleString("fr-FR")
    : "0";
}

function setStatus(message, type = "") {
  const el = $("pageStatus");
  el.textContent = message;
  el.className = "status" + (type ? " " + type : "");
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function safeImageSource(path) {
  if (typeof path !== "string" || !path.trim()) return "";
  const value = path.trim();

  // Ne pas inventer de bucket ni de chemin de stockage.
  // Les URL complètes sont affichées telles qu'elles viennent de la base.
  if (/^https:\/\/[^ ]+$/i.test(value)) return value;
  return "";
}

function renderEmpty(container, message) {
  container.replaceChildren();
  const box = element("div", "empty", message);
  container.appendChild(box);
}

function createProductCard(product, owned = false) {
  const card = element("article", "product-card");
  const picture = element("div", "product-picture");

  const imageSource = safeImageSource(product.image_path);
  if (imageSource) {
    const img = element("img");
    img.src = imageSource;
    img.alt = product.name || "Produit";
    img.loading = "lazy";
    img.onerror = () => {
      img.remove();
      const symbol = element("div", "product-symbol", "▣");
      picture.appendChild(symbol);
    };
    picture.appendChild(img);
  } else {
    picture.appendChild(element("div", "product-symbol", "▣"));
  }

  picture.appendChild(element("h3", "", product.name || product.product_name || "Produit"));
  card.appendChild(picture);

  const info = element("div", "product-info");
  const price = owned
    ? Number(product.amount_invested || 0)
    : Number(product.price || 0);

  info.appendChild(element("div", "price", "XOF " + money(price)));

  const duration = Number(product.cycle_days || 0);
  const daily = Number(product.daily_income || 0);
  const total = Number(product.total_income || 0);

  addDetail(info, "Durée :", duration > 0 ? duration + " jours" : "—");
  addDetail(info, "Revenu quotidien :", money(daily) + " FCFA");
  addDetail(info, "Revenu total :", money(total) + " FCFA");

  if (owned) {
    info.appendChild(element("div", "owned-badge",
      product.status === "active" ? "Produit actif" : "Achat enregistré"));
  } else {
    const buy = element("button", "buy-btn", "Acheter");
    buy.type = "button";
    buy.addEventListener("click", () => buyProduct(product, buy));
    info.appendChild(buy);
  }

  card.appendChild(info);
  return card;
}

function addDetail(parent, label, value) {
  const row = element("div", "detail-row");
  row.appendChild(element("span", "label", label));
  row.appendChild(element("span", "value", value));
  parent.appendChild(row);
}

function renderMyProducts() {
  const container = $("myProductsList");
  container.classList.toggle("list-mode", !gridMode);

  if (!myProducts.length) {
    renderEmpty(container, "Tu n’as pas encore acheté de produit.");
    return;
  }

  container.replaceChildren();
  myProducts.forEach(product => {
    container.appendChild(createProductCard(product, true));
  });
}

function renderCatalog() {
  const container = $("catalogList");
  container.classList.toggle("list-mode", !gridMode);

  const items = activeTab === "products"
    ? catalogProducts
    : promotionProducts;

  container.replaceChildren();

  if (!items.length) {
    renderEmpty(
      container,
      activeTab === "products"
        ? "Aucun produit disponible dans la base pour le moment."
        : "Aucune promotion disponible dans la base pour le moment."
    );
    return;
  }

  items.forEach(product => {
    container.appendChild(createProductCard(product, false));
  });
}

function updateTabs() {
  document.querySelectorAll("[data-tab]").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === activeTab);
  });
}

async function postJson(url, payload) {
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await response.json().catch(() => ({}));

  if (response.status === 401) {
    sessionStorage.removeItem("phome_session_token");
    sessionStorage.removeItem("phome_user_id");
    window.location.href = "login.html";
    throw new Error("Session expirée. Reconnecte-toi.");
  }

  if (!response.ok || data.success === false) {
    throw new Error(data.message || "Une erreur est survenue.");
  }

  return data;
}

async function loadProducts() {
  if (!token || !userId) {
    window.location.href = "login.html";
    return;
  }

  setStatus("Chargement des produits et de tes revenus depuis Supabase…");

  try {
    const data = await postJson(PRODUCTS_ENDPOINT, { token });

    catalogProducts = Array.isArray(data.products) ? data.products : [];
    promotionProducts = Array.isArray(data.promotions) ? data.promotions : [];
    myProducts = Array.isArray(data.my_products) ? data.my_products : [];

    $("productCount").textContent = money(
      Number.isFinite(Number(data.product_count))
        ? data.product_count
        : myProducts.length
    );

    $("totalIncome").textContent = money(data.total_cumule);

    renderMyProducts();
    updateTabs();
    renderCatalog();

    setStatus(
      "Données chargées depuis la base de données.",
      "success"
    );
  } catch (error) {
    renderEmpty($("myProductsList"), "Impossible de charger tes produits.");
    renderEmpty($("catalogList"), "Impossible de charger le catalogue.");
    setStatus(error.message || "Erreur de connexion.", "error");
  }
}

async function buyProduct(product, button) {
  const productName = product.name || "ce produit";
  const price = Number(product.price || 0);

  if (!product.id || !Number.isFinite(price) || price <= 0) {
    setStatus("Les informations de ce produit sont invalides.", "error");
    return;
  }

  const confirmed = window.confirm(
    "Confirmer l’achat de « " + productName + " » pour XOF " +
    money(price) + " ? Le serveur vérifiera ton solde avant l’achat."
  );

  if (!confirmed) return;

  button.disabled = true;
  button.textContent = "Achat en cours…";
  setStatus("Envoi de la demande d’achat au serveur…");

  try {
    // Appelle la fonction serveur qui exécute le RPC SQL buy_product.
    const result = await postJson(BUY_ENDPOINT, {
      token,
      product_id: product.id
    });

    setStatus(
      "Achat confirmé par le serveur : " +
      (result.product_name || productName) +
      " — XOF " + money(result.amount ?? price) + ".",
      "success"
    );

    await loadProducts();

    $("myProductsSection").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  } catch (error) {
    setStatus(error.message || "L’achat a échoué.", "error");
    button.disabled = false;
    button.textContent = "Acheter";
  }
}

document.querySelectorAll("[data-tab]").forEach(button => {
  button.addEventListener("click", () => {
    activeTab = button.dataset.tab;
    updateTabs();
    renderCatalog();
  });
});

$("layoutToggle").addEventListener("click", () => {
  gridMode = !gridMode;
  $("layoutToggle").textContent = gridMode ? "▦" : "☰";
  renderCatalog();
  renderMyProducts();
});

$("myProductsLink").addEventListener("click", () => {
  $("myProductsSection").scrollIntoView({ behavior: "smooth" });
});

$("incomeLink").addEventListener("click", () => {
  $("myProductsSection").scrollIntoView({ behavior: "smooth" });
});

loadProducts();
</script>
</body>
          </html>
