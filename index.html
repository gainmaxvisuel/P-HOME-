<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Créer un compte | P HOME</title>
<style>
:root{
  --bg:#0d1117;
  --surface:#151b23;
  --field:#10151c;
  --border:#2a323d;
  --border-strong:#3d4856;
  --text:#f0f3f6;
  --muted:#8b95a3;
  --accent:#3b8cff;
  --accent-soft:rgba(59,140,255,.18);
  --danger:#ff6b6b;
  --danger-bg:rgba(255,107,107,.1);
  --ok:#3ddc84;
  --ok-bg:rgba(61,220,132,.1);
  --radius:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
.page{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
}
.card{width:100%;max-width:440px}

.brand{display:flex;justify-content:center;margin-bottom:28px}
.brand img{height:84px;max-width:70%;object-fit:contain}

h1{margin:0 0 6px;font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-align:center}
.lead{margin:0 0 28px;color:var(--muted);font-size:15px;text-align:center}

form{display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:7px}
label,.label{font-size:14px;font-weight:600;color:var(--text)}
.optional{font-weight:400;color:var(--muted)}

.field{
  display:flex;align-items:center;height:52px;
  background:var(--field);border:1px solid var(--border);border-radius:var(--radius);
  transition:border-color .15s,box-shadow .15s;
}
.field:hover{border-color:var(--border-strong)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field.invalid{border-color:var(--danger)}
.field.invalid:focus-within{box-shadow:0 0 0 4px rgba(255,107,107,.18)}

input{
  flex:1;min-width:0;height:100%;padding:0 16px;
  background:transparent;color:var(--text);border:0;outline:0;
  font:inherit;font-size:16px;
}
input::placeholder{color:#5d6773}

.country{
  display:flex;align-items:center;gap:6px;height:100%;
  padding:0 12px 0 16px;background:transparent;color:var(--text);
  border:0;border-right:1px solid var(--border);border-radius:var(--radius) 0 0 var(--radius);
  font:inherit;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.country:hover:not(:disabled){background:rgba(255,255,255,.04)}
.country:disabled{opacity:.5;cursor:not-allowed}
.country svg{width:14px;height:14px;color:var(--muted)}

.toggle{
  display:grid;place-items:center;width:48px;height:100%;
  background:transparent;border:0;color:var(--muted);cursor:pointer;
  border-radius:0 var(--radius) var(--radius) 0;
}
.toggle:hover{color:var(--text)}
.toggle svg{width:20px;height:20px}

.hint{margin:0;font-size:13px;color:var(--muted)}

#message{
  display:none;padding:12px 14px;border-radius:var(--radius);
  font-size:14px;overflow-wrap:anywhere;border:1px solid transparent;
}
#message.show{display:block}
#message.error{background:var(--danger-bg);border-color:rgba(255,107,107,.35);color:#ffc9c9}
#message.success{background:var(--ok-bg);border-color:rgba(61,220,132,.35);color:#c5f5d8}

.submit{
  height:52px;margin-top:4px;border:0;border-radius:var(--radius);
  background:#fff;color:#0d1117;font:inherit;font-size:16px;font-weight:700;
  cursor:pointer;transition:background .15s,transform .05s;
}
.submit:hover:not(:disabled){background:#e4e8ee}
.submit:active:not(:disabled){transform:translateY(1px)}
.submit:disabled{opacity:.6;cursor:progress}

.switch{margin:22px 0 0;text-align:center;font-size:15px;color:var(--muted)}
a{color:var(--accent);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field :focus-visible{outline:none}

/* Sélecteur de pays */
.backdrop{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(5,8,12,.72);backdrop-filter:blur(3px);z-index:10;
}
.backdrop.open{display:flex}
.modal{
  width:100%;max-width:440px;max-height:min(80dvh,560px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
.modal-head h2{margin:0;font-size:17px;font-weight:700}
.close{
  display:grid;place-items:center;width:36px;height:36px;background:transparent;
  border:0;border-radius:50%;color:var(--muted);cursor:pointer;
}
.close:hover{background:rgba(255,255,255,.06);color:var(--text)}
.close svg{width:18px;height:18px}
.search{padding:0 18px 12px}
.search .field{height:44px}
#countryList{overflow-y:auto;border-top:1px solid var(--border)}
.country-option{
  width:100%;min-height:56px;padding:0 18px;border:0;border-bottom:1px solid var(--border);
  background:transparent;color:var(--text);display:flex;justify-content:space-between;align-items:center;
  gap:12px;font:inherit;font-size:16px;text-align:left;cursor:pointer;
}
.country-option:last-child{border-bottom:0}
.country-option:hover{background:rgba(255,255,255,.04)}
.country-option[aria-selected="true"]{background:var(--accent-soft)}
.dial{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:24px 18px;text-align:center;color:var(--muted);font-size:14px}

@media (max-width:480px){
  .page{align-items:flex-start}
  .backdrop{align-items:flex-end;padding:0}
  .modal{max-width:none;border-radius:20px 20px 0 0;max-height:80dvh}
}
@media (max-height:700px){
  .brand{margin-bottom:16px}
  .brand img{height:60px}
  .lead{margin-bottom:18px}
  form{gap:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <div class="card">
    <div class="brand"><img src="logoreg.png" alt="P HOME"></div>

    <h1>Créer un compte</h1>
    <p class="lead">Inscrivez-vous avec votre numéro de téléphone.</p>

    <form id="registerForm" novalidate>
      <div class="group">
        <label for="phone">Numéro de téléphone</label>
        <div class="field" id="phoneField">
          <button class="country" id="countryButton" type="button"
            aria-haspopup="dialog" aria-label="Choisir l'indicatif du pays">
            <span id="dial">+226</span>
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
          </button>
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national"
            maxlength="8" placeholder="8 chiffres" required>
        </div>
      </div>

      <div class="group">
        <label for="password">Mot de passe</label>
        <div class="field">
          <input id="password" type="password" minlength="6" maxlength="72"
            autocomplete="new-password" placeholder="6 caractères minimum" required>
          <button class="toggle" type="button" data-target="password" aria-label="Afficher le mot de passe"></button>
        </div>
      </div>

      <div class="group">
        <label for="confirm">Confirmer le mot de passe</label>
        <div class="field">
          <input id="confirm" type="password" minlength="6" maxlength="72"
            autocomplete="new-password" placeholder="Saisissez-le à nouveau" required>
          <button class="toggle" type="button" data-target="confirm" aria-label="Afficher le mot de passe"></button>
        </div>
      </div>

      <div class="group">
        <label for="referral">Code d'invitation <span class="optional">(facultatif)</span></label>
        <div class="field">
          <input id="referral" type="text" maxlength="5" autocomplete="off"
            autocapitalize="none" spellcheck="false" placeholder="5 caractères">
        </div>
      </div>

      <div id="message" role="status" aria-live="polite"></div>

      <button class="submit" id="submit" type="submit">S'inscrire</button>
    </form>

    <p class="switch">Vous avez déjà un compte ? <a href="login.html">Se connecter</a></p>
  </div>
</main>

<div class="backdrop" id="backdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Indicatif du pays</h2>
      <button class="close" id="closeModal" type="button" aria-label="Fermer">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <div class="search">
      <div class="field">
        <input id="countrySearch" type="search" placeholder="Rechercher un pays" aria-label="Rechercher un pays" autocomplete="off">
      </div>
    </div>
    <div id="countryList" role="listbox" aria-label="Pays"></div>
  </section>
</div>

<script>
"use strict";

// Fonction serveur P HOME : aucune clé API dans cette page.
const API = "https://rdnrmufucbhsvgpnqodh.supabase.co/functions/v1/p-home-registration";

const $ = id => document.getElementById(id);
let countries = [];
let selectedCountry = null;

const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

function clearInvalid() {
  document.querySelectorAll(".field.invalid").forEach(f => f.classList.remove("invalid"));
}

function message(text, type, fieldId) {
  clearInvalid();
  $("message").textContent = text;
  $("message").className = "show " + type;

  if (type === "error" && fieldId) {
    const input = $(fieldId);
    input.closest(".field").classList.add("invalid");
    input.focus();
  }
}

/* Afficher / masquer les mots de passe */
document.querySelectorAll(".toggle").forEach(btn => {
  btn.innerHTML = EYE;
  btn.onclick = () => {
    const input = $(btn.dataset.target);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.innerHTML = show ? EYE_OFF : EYE;
    btn.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
  };
});

/* Liste des pays */
function renderCountries(filter = "") {
  const list = $("countryList");
  list.replaceChildren();

  const query = filter.trim().toLowerCase();
  const items = countries.filter(c =>
    !query ||
    c.country_name.toLowerCase().includes(query) ||
    String(c.dial_code).includes(query)
  );

  if (items.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Aucun pays trouvé.";
    list.appendChild(empty);
    return;
  }

  items.forEach(country => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "country-option";
    button.setAttribute("role", "option");
    button.setAttribute("aria-selected",
      selectedCountry && selectedCountry.country_code === country.country_code ? "true" : "false");

    const name = document.createElement("span");
    name.textContent = country.country_name;

    const dial = document.createElement("span");
    dial.className = "dial";
    dial.textContent = country.dial_code;

    button.append(name, dial);

    button.onclick = () => {
      selectedCountry = country;
      $("dial").textContent = country.dial_code;
      closeModal();
    };

    list.appendChild(button);
  });
}

function openModal() {
  $("countrySearch").value = "";
  renderCountries();
  $("backdrop").classList.add("open");
  $("countrySearch").focus();
}

function closeModal() {
  $("backdrop").classList.remove("open");
  $("countryButton").focus();
}

async function loadCountries() {
  $("countryButton").disabled = true;

  try {
    const response = await fetch(API);
    const data = await response.json();

    if (!response.ok || !Array.isArray(data.countries)) {
      throw new Error(data.error || "Impossible de charger les pays.");
    }

    countries = data.countries;

    selectedCountry =
      countries.find(c => c.country_code === "BF") || countries[0];

    if (!selectedCountry) {
      throw new Error("Aucun pays actif dans la base.");
    }

    $("dial").textContent = selectedCountry.dial_code;
  } catch (error) {
    message(error.message || "Erreur de connexion au serveur.", "error");
  } finally {
    $("countryButton").disabled = countries.length === 0;
  }
}

$("countryButton").onclick = openModal;
$("closeModal").onclick = closeModal;
$("countrySearch").addEventListener("input", e => renderCountries(e.target.value));

$("backdrop").onclick = event => {
  if (event.target === $("backdrop")) closeModal();
};

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && $("backdrop").classList.contains("open")) {
    closeModal();
  }
});

/* Filtres de saisie */
$("phone").addEventListener("input", event => {
  event.target.value = event.target.value.replace(/\D/g, "").slice(0, 8);
});

$("referral").addEventListener("input", event => {
  event.target.value = event.target.value.toLowerCase()
    .replace(/[^a-z0-9]/g, "").slice(0, 5);
});

/* Envoi du formulaire */
$("registerForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!selectedCountry) {
    return message("Sélectionnez un pays.", "error", "countryButton");
  }

  const phone = $("phone").value.trim();
  const password = $("password").value;
  const confirm = $("confirm").value;
  const referral = $("referral").value.trim();

  if (!/^\d{8}$/.test(phone)) {
    return message("Le numéro doit contenir exactement 8 chiffres.", "error", "phone");
  }

  if (password.length < 6 || password.length > 72) {
    return message("Le mot de passe doit contenir entre 6 et 72 caractères.", "error", "password");
  }

  if (password !== confirm) {
    return message("Les mots de passe ne correspondent pas.", "error", "confirm");
  }

  if (referral && !/^[a-z0-9]{5}$/.test(referral)) {
    return message("Le code d'invitation doit contenir 5 caractères.", "error", "referral");
  }

  clearInvalid();
  $("message").className = "";
  $("submit").disabled = true;
  $("submit").textContent = "Inscription en cours…";

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        country_code: selectedCountry.country_code,
        phone: phone,
        password: password,
        confirm_password: confirm,
        referral_code: referral
      })
    });

    const result = await response.json();

    if (!response.ok || result.success !== true) {
      throw new Error(result.error || "L'inscription a échoué.");
    }

    if (result.session_token) {
      sessionStorage.setItem("phome_session_token", result.session_token);
    }

    if (result.user_id) {
      sessionStorage.setItem("phome_user_id", result.user_id);
    }

    $("registerForm").reset();
    message("Inscription réussie. Votre compte a été créé.", "success");

  } catch (error) {
    message(error.message || "Erreur serveur. Réessayez.", "error");
  } finally {
    $("submit").disabled = false;
    $("submit").textContent = "S'inscrire";
  }
});

loadCountries();
</script>
</body>
  </html>
