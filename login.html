<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Connexion | P HOME</title>
<style>
:root{
  --bg:#0d1117;
  --surface:#151b23;
  --field:#10151c;
  --border:#2a323d;
  --border-strong:#3d4856;
  --text:#f0f3f6;
  --muted:#8b95a3;
  --accent:#3b8cff;
  --accent-soft:rgba(59,140,255,.18);
  --danger:#ff6b6b;
  --danger-bg:rgba(255,107,107,.1);
  --radius:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
.page{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
}
.card{width:100%;max-width:440px}

.brand{display:flex;justify-content:center;margin-bottom:28px}
.brand img{height:84px;max-width:70%;object-fit:contain}

h1{margin:0 0 6px;font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-align:center}
.lead{margin:0 0 28px;color:var(--muted);font-size:15px;text-align:center}

form{display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:7px}
label{font-size:14px;font-weight:600;color:var(--text)}

.field{
  display:flex;align-items:center;height:52px;
  background:var(--field);border:1px solid var(--border);border-radius:var(--radius);
  transition:border-color .15s,box-shadow .15s;
}
.field:hover{border-color:var(--border-strong)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field.invalid{border-color:var(--danger)}
.field.invalid:focus-within{box-shadow:0 0 0 4px rgba(255,107,107,.18)}

input{
  flex:1;min-width:0;height:100%;padding:0 16px;
  background:transparent;color:var(--text);border:0;outline:0;
  font:inherit;font-size:16px;
}
input::placeholder{color:#5d6773}

.country{
  display:flex;align-items:center;gap:8px;height:100%;
  padding:0 12px 0 14px;background:transparent;color:var(--text);
  border:0;border-right:1px solid var(--border);border-radius:var(--radius) 0 0 var(--radius);
  font:inherit;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.country:hover{background:rgba(255,255,255,.04)}
.country svg{width:14px;height:14px;color:var(--muted)}
.flag{font-size:20px;line-height:1}

.toggle{
  display:grid;place-items:center;width:48px;height:100%;
  background:transparent;border:0;color:var(--muted);cursor:pointer;
  border-radius:0 var(--radius) var(--radius) 0;
}
.toggle:hover{color:var(--text)}
.toggle svg{width:20px;height:20px}

#error{
  display:none;padding:12px 14px;border-radius:var(--radius);
  font-size:14px;overflow-wrap:anywhere;
  background:var(--danger-bg);border:1px solid rgba(255,107,107,.35);color:#ffc9c9;
}

.submit{
  height:52px;margin-top:4px;border:0;border-radius:var(--radius);
  background:#fff;color:#0d1117;font:inherit;font-size:16px;font-weight:700;
  cursor:pointer;transition:background .15s,transform .05s;
}
.submit:hover:not(:disabled){background:#e4e8ee}
.submit:active:not(:disabled){transform:translateY(1px)}
.submit:disabled{opacity:.6;cursor:progress}

.switch{margin:22px 0 0;text-align:center;font-size:15px;color:var(--muted)}
a{color:var(--accent);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field :focus-visible{outline:none}

/* Sélecteur de pays */
.backdrop{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(5,8,12,.72);backdrop-filter:blur(3px);z-index:10;
}
.backdrop.open{display:flex}
.modal{
  width:100%;max-width:440px;max-height:min(80dvh,560px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
.modal-head h2{margin:0;font-size:17px;font-weight:700}
.close{
  display:grid;place-items:center;width:36px;height:36px;background:transparent;
  border:0;border-radius:50%;color:var(--muted);cursor:pointer;
}
.close:hover{background:rgba(255,255,255,.06);color:var(--text)}
.close svg{width:18px;height:18px}
#countryList{overflow-y:auto;border-top:1px solid var(--border)}
.country-option{
  width:100%;min-height:58px;padding:0 18px;border:0;border-bottom:1px solid var(--border);
  background:transparent;color:var(--text);display:flex;align-items:center;
  gap:14px;font:inherit;font-size:16px;text-align:left;cursor:pointer;
}
.country-option:last-child{border-bottom:0}
.country-option:hover{background:rgba(255,255,255,.04)}
.country-option[aria-selected="true"]{background:var(--accent-soft)}
.country-option .name{flex:1}
.dial{color:var(--muted);font-variant-numeric:tabular-nums}

@media (max-width:480px){
  .page{align-items:flex-start}
  .backdrop{align-items:flex-end;padding:0}
  .modal{max-width:none;border-radius:20px 20px 0 0;max-height:80dvh}
}
@media (max-height:700px){
  .brand{margin-bottom:16px}
  .brand img{height:60px}
  .lead{margin-bottom:18px}
  form{gap:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <div class="card">
    <div class="brand"><img src="logoreg.png" alt="P HOME"></div>

    <h1>Connexion</h1>
    <p class="lead">Accédez à votre espace P HOME.</p>

    <form id="loginForm" novalidate>
      <div class="group">
        <label for="phone">Numéro de téléphone</label>
        <div class="field">
          <button class="country" id="countryBtn" type="button"
            aria-haspopup="dialog" aria-label="Choisir le pays">
            <span class="flag" id="selectedFlag">🇧🇫</span>
            <span id="selectedDial">+226</span>
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
          </button>
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national"
            maxlength="8" placeholder="8 chiffres" required>
        </div>
      </div>

      <div class="group">
        <label for="password">Mot de passe</label>
        <div class="field">
          <input id="password" type="password" autocomplete="current-password"
            placeholder="Votre mot de passe" required>
          <button class="toggle" type="button" id="togglePassword" aria-label="Afficher le mot de passe"></button>
        </div>
      </div>

      <div id="error" role="alert"></div>

      <button class="submit" id="submitBtn" type="submit">Se connecter</button>
    </form>

    <p class="switch">Pas encore de compte ? <a href="index.html">Créer un compte</a></p>
  </div>
</main>

<div class="backdrop" id="countryOverlay">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Choisir votre pays</h2>
      <button class="close" id="closeCountry" type="button" aria-label="Fermer">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <div id="countryList" role="listbox" aria-label="Pays"></div>
  </section>
</div>

<script>
"use strict";

/*
 * P HOME — CONNEXION
 * Aucune clé Supabase dans cette page : elle communique uniquement
 * avec la fonction serveur, qui reste la source de vérité.
 */
const LOGIN_ENDPOINT =
  "https://rdnrmufucbhsvgpnqodh.supabase.co/functions/v1/p-home-login";

const COUNTRIES = [
  { code: "BF", name: "Burkina Faso", dial: "+226", flag: "🇧🇫" },
  { code: "TG", name: "Togo",         dial: "+228", flag: "🇹🇬" },
  { code: "BJ", name: "Bénin",        dial: "+229", flag: "🇧🇯" }
];

let selectedCountry = COUNTRIES[0];

const $ = id => document.getElementById(id);

const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

/* ---------------- Erreurs ---------------- */

function clearInvalid() {
  document.querySelectorAll(".field.invalid").forEach(f => f.classList.remove("invalid"));
}

function showError(text, fieldId) {
  clearInvalid();
  $("error").textContent = text;
  $("error").style.display = "block";

  if (fieldId) {
    const input = $(fieldId);
    input.closest(".field").classList.add("invalid");
    input.focus();
  }
}

function hideError() {
  clearInvalid();
  $("error").textContent = "";
  $("error").style.display = "none";
}

/* ---------------- Pays ---------------- */

function renderCountries() {
  const list = $("countryList");
  list.replaceChildren();

  COUNTRIES.forEach(country => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "country-option";
    button.setAttribute("role", "option");
    button.setAttribute("aria-selected", country.code === selectedCountry.code ? "true" : "false");

    const flag = document.createElement("span");
    flag.className = "flag";
    flag.textContent = country.flag;

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = country.name;

    const dial = document.createElement("span");
    dial.className = "dial";
    dial.textContent = country.dial;

    button.append(flag, name, dial);

    button.addEventListener("click", () => {
      selectedCountry = country;
      $("selectedFlag").textContent = country.flag;
      $("selectedDial").textContent = country.dial;
      closeModal(false);
      $("phone").focus();
    });

    list.appendChild(button);
  });
}

function openModal() {
  renderCountries();
  $("countryOverlay").classList.add("open");
  $("closeCountry").focus();
}

function closeModal(restoreFocus = true) {
  $("countryOverlay").classList.remove("open");
  if (restoreFocus) $("countryBtn").focus();
}

$("countryBtn").addEventListener("click", openModal);
$("closeCountry").addEventListener("click", () => closeModal());

$("countryOverlay").addEventListener("click", event => {
  if (event.target === $("countryOverlay")) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && $("countryOverlay").classList.contains("open")) {
    closeModal();
  }
});

/* ---------------- Mot de passe ---------------- */

$("togglePassword").innerHTML = EYE;
$("togglePassword").addEventListener("click", () => {
  const show = $("password").type === "password";
  $("password").type = show ? "text" : "password";
  $("togglePassword").innerHTML = show ? EYE_OFF : EYE;
  $("togglePassword").setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
});

/* ---------------- Téléphone ---------------- */

$("phone").addEventListener("input", () => {
  $("phone").value = $("phone").value.replace(/\D/g, "").slice(0, 8);
});

/* ---------------- Connexion ---------------- */

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  hideError();

  const phoneValue = $("phone").value.trim();
  const passwordValue = $("password").value;

  if (!/^\d{8}$/.test(phoneValue)) {
    return showError("Entrez un numéro de téléphone valide à 8 chiffres.", "phone");
  }

  if (!passwordValue) {
    return showError("Entrez votre mot de passe.", "password");
  }

  $("submitBtn").disabled = true;
  $("submitBtn").textContent = "Connexion…";

  try {
    const response = await fetch(LOGIN_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        country_code: selectedCountry.code,
        phone: phoneValue,
        password: passwordValue
      })
    });

    let data = {};
    try {
      data = await response.json();
    } catch (_) {
      data = {};
    }

    if (!response.ok || data.success === false) {
      throw new Error(data.error || data.message || "Numéro ou mot de passe incorrect.");
    }

    // On ne garde que les informations de session.
    if (data.session_token) {
      sessionStorage.setItem("phome_session_token", data.session_token);
    }

    if (data.user_id) {
      sessionStorage.setItem("phome_user_id", data.user_id);
    }

    // Redirection directe vers le tableau de bord.
    window.location.replace("dashboard.html");

  } catch (error) {
    showError(error.message || "Impossible de se connecter. Réessayez.");
  } finally {
    $("submitBtn").disabled = false;
    $("submitBtn").textContent = "Se connecter";
  }
});
</script>
</body>
  </html>
